<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aris – Consulente gestionali e progetti con l’AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700;800&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f6f6fb; --ink:#12121c; --muted:#5c5c72; --card:rgba(255,255,255,.7); --line:rgba(18,18,28,.12);
  --a:#6a4dff; --b:#00a8c6; --c:#e0309f; --grid:rgba(18,18,28,.06);
  --sans:"Geist","Helvetica Neue",Arial,sans-serif; --mono:"Geist Mono",ui-monospace,Menlo,monospace;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#07070d; --ink:#f4f4fa; --muted:#a0a0b8; --card:rgba(255,255,255,.045); --line:rgba(255,255,255,.12); --a:#8b6cff; --b:#22d3ee; --c:#ff4ecd; --grid:rgba(255,255,255,.05); color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#07070d; --ink:#f4f4fa; --muted:#a0a0b8; --card:rgba(255,255,255,.045); --line:rgba(255,255,255,.12); --a:#8b6cff; --b:#22d3ee; --c:#ff4ecd; --grid:rgba(255,255,255,.05); color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:1rem;line-height:1.6;overflow-x:hidden;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:48px 48px}
.glow{position:absolute;inset:0 0 auto 0;height:720px;overflow:hidden;z-index:0;pointer-events:none}
.glow i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;animation:drift 14s ease-in-out infinite alternate}
.glow i:nth-child(1){width:420px;height:420px;background:var(--a);left:-80px;top:-60px}
.glow i:nth-child(2){width:380px;height:380px;background:var(--c);right:-60px;top:60px;animation-delay:-5s}
.glow i:nth-child(3){width:320px;height:320px;background:var(--b);left:35%;top:240px;animation-delay:-9s}
@keyframes drift{to{transform:translate(60px,40px) scale(1.15)}}
@media (prefers-reduced-motion:reduce){.glow i{animation:none}html{scroll-behavior:auto}}
.page{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:0 1.25rem 4rem}
header{padding:4.5rem 0 3.5rem}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
.pill{display:inline-block;font-family:var(--mono);font-size:.82rem;padding:.3rem .8rem;border:1px solid var(--line);border-radius:999px;background:var(--card);backdrop-filter:blur(8px)}
.theme-btn{font-family:var(--mono);font-size:.82rem;padding:.3rem .8rem;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);cursor:pointer;backdrop-filter:blur(8px);transition:border-color .15s,transform .15s}
.theme-btn:hover{border-color:var(--a);transform:translateY(-1px)}
h1{font-weight:800;font-size:clamp(4rem,17vw,9.5rem);line-height:.9;letter-spacing:-.06em;margin:1.2rem 0 1rem;
  background:linear-gradient(100deg,var(--a),var(--c) 50%,var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:clamp(1.2rem,3.2vw,1.75rem);line-height:1.35;max-width:26em;margin:0 0 2rem;font-weight:500;letter-spacing:-.02em}
.sub span{color:var(--muted)}
nav{display:flex;flex-wrap:wrap;gap:.6rem}
nav a{color:var(--ink);text-decoration:none;font-weight:500;font-size:.95rem;padding:.55rem 1.1rem;border-radius:999px;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(8px);transition:transform .15s,border-color .15s}
nav a:first-child{background:linear-gradient(100deg,var(--a),var(--c));border-color:transparent;color:#fff}
nav a:hover{transform:translateY(-2px);border-color:var(--a)}
a:focus-visible,button:focus-visible{outline:2px solid var(--b);outline-offset:3px}
section{padding:3rem 0 0}
h2{font-size:clamp(1.8rem,5vw,2.6rem);letter-spacing:-.04em;line-height:1.05;margin:0 0 1.5rem;font-weight:800}
h3.subhead{font-size:1.35rem;letter-spacing:-.03em;margin:2.5rem 0 1rem;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.9rem}
.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:1.25rem;backdrop-filter:blur(10px)}
.stat b{display:block;font-size:2rem;letter-spacing:-.04em;line-height:1.1}
.stat span{color:var(--muted);font-size:.9rem}
.tl{border-left:2px solid var(--line);margin-left:.5rem;padding-left:1.5rem;display:grid;gap:1.75rem}
.tl>div{position:relative}
.tl>div::before{content:"";position:absolute;left:calc(-1.5rem - 7px);top:.45rem;width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--c))}
h3{margin:0;font-size:1.2rem;letter-spacing:-.02em}
.when{font-family:var(--mono);font-size:.82rem;color:var(--muted);margin:.15rem 0 .5rem}
ul{margin:.4rem 0 0;padding-left:1.1rem;max-width:44em}
li{margin:.3rem 0}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;list-style:none;padding:0;margin:0}
.chips li{margin:0;padding:.4rem .9rem;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:.92rem;font-weight:500}
.chips li.hot{border-color:transparent;background:linear-gradient(100deg,var(--a),var(--b));color:#fff}
.bento{display:grid;gap:.9rem;grid-template-columns:1fr}
@media(min-width:700px){
  .bento{grid-template-columns:repeat(6,1fr)}
  .bento .card{grid-column:span 3}
  .bento .wide{grid-column:span 4}
  .bento .narrow{grid-column:span 2}
  .bento .full{grid-column:span 6}
}
.card{position:relative;transition:transform .2s,border-color .2s,box-shadow .2s}
.card:hover{transform:translateY(-4px);border-color:var(--a);box-shadow:0 12px 40px -12px var(--a)}
.card p{margin:.4rem 0 0;color:var(--muted);font-size:.95rem}
.tag{font-family:var(--mono);font-size:.78rem;display:inline-block;margin-bottom:.6rem;padding:.15rem .6rem;border-radius:999px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.tag.t2{background:color-mix(in srgb,var(--b) 18%,transparent);color:var(--b)}
.tag.t3{background:color-mix(in srgb,var(--a) 20%,transparent);color:var(--a)}
.idea{border-style:dashed}
.sub2{color:var(--muted);margin:-.75rem 0 1.5rem;max-width:38em}
footer{margin-top:4.5rem;padding-top:2rem;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem}
footer p{margin:0;color:var(--muted);font-size:.92rem}
.links{display:flex;gap:.6rem;flex-wrap:wrap}
.links a{color:var(--ink);text-decoration:none;font-family:var(--mono);font-size:.85rem;padding:.45rem .95rem;border-radius:999px;border:1px solid var(--line);background:var(--card);transition:border-color .15s,transform .15s}
.links a:hover{border-color:var(--a);transform:translateY(-2px)}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="page">
  <header>
    <div class="topbar">
      <span class="pill">Marche, Italia</span>
      <button class="theme-btn" id="themeToggle" type="button" aria-label="Cambia tema">Tema: Auto</button>
    </div>
    <h1>Aris</h1>
    <p class="sub">Aiuto i calzaturifici a far funzionare i loro gestionali. <span>E nel tempo libero progetto e sviluppo app, automazioni e strumenti con l’AI.</span></p>
    <nav aria-label="Sezioni">
      <a href="#progetti">Guarda i progetti</a>
      <a href="#esperienza">Esperienza</a>
      <a href="#competenze">Competenze</a>
      <a href="#formazione">Formazione</a>
      <a href="#contatti">Contatti</a>
    </nav>
  </header>

  <section>
    <div class="stats">
      <div class="stat"><b>3 anni</b><span>da consulente software</span></div>
      <div class="stat"><b>10 anni</b><span>nell’ospitalità</span></div>
      <div class="stat"><b>SQL</b><span>lo strumento di tutti i giorni</span></div>
      <div class="stat"><b>DModa</b><span>produzione, ordini, distinta base</span></div>
    </div>
  </section>

  <section id="progetti">
    <h2>Progetti con l’AI</h2>
    <p class="sub2">Nati da bisogni reali, progettati e sviluppati sperimentando con l’AI.</p>
    <div class="bento">
      <div class="card wide">
        <span class="tag t2">Web App · Cursor</span>
        <h3>Gestionale Bar</h3>
        <p>Un gestionale pensato per l’attività di bar, sviluppato con Cursor unendo la logica dei software ERP alla mia esperienza sul campo nell’ospitalità.</p>
      </div>
      <div class="card narrow">
        <span class="tag">App web</span>
        <h3>Draft Night</h3>
        <p>Organizza le serate di draft di Magic dal vivo: pod, abbinamenti dei turni e classifica.</p>
      </div>
      <div class="card full">
        <span class="tag t3">Automazione &amp; API · Operativo</span>
        <h3>Microlearning su Telegram</h3>
        <p>Pipeline attiva che utilizzo quotidianamente: script per la ricerca automatica di articoli, generazione di riassunti tramite chiamate API a Gemini e invio diretto su Telegram tramite bot.</p>
      </div>
    </div>

    <h3 class="subhead">In cantiere</h3>
    <div class="bento">
      <div class="card idea">
        <span class="tag t3">Web App &amp; AI · Antigravity</span>
        <h3>Piattaforma Fantacalcio (Classic &amp; Mantra)</h3>
        <p>Strumento in sviluppo per gestire l’asta in tempo reale e suggerire la formazione ottimale incrociando dati, ruoli e probabili formazioni.</p>
      </div>
      <div class="card idea">
        <span class="tag t2">Android</span>
        <h3>Carte fedeltà</h3>
        <p>Tutte le tessere e i codici a barre dei negozi raccolti in un’unica app leggera.</p>
      </div>
      <div class="card idea full">
        <span class="tag t2">Android</span>
        <h3>Prezzi carburanti</h3>
        <p>Confronto tra benzina, diesel e GPL con filtri per zona per trovare i distributori più convenienti.</p>
      </div>
    </div>
  </section>

  <section id="esperienza">
    <h2>Esperienza</h2>
    <div class="tl">
      <div>
        <h3>Business consultant · Emmedata</h3>
        <p class="when">Marche · da circa 3 anni</p>
        <ul>
          <li>Seguo progetti per calzaturifici: spiego ai clienti come usare i programmi e analizzo i loro problemi.</li>
          <li>Fornisco programmi su misura, li collaudo e formo gli utenti.</li>
          <li>Lavoro in team su progetti per grandi marchi; ho gestito da solo un piccolo calzaturificio.</li>
        </ul>
      </div>
      <div>
        <h3>Ospitalità</h3>
        <p class="when">Circa 10 anni</p>
        <ul><li>Anni a contatto con il pubblico: da lì vengono ascolto, pazienza e la capacità di spiegare le cose con semplicità.</li></ul>
      </div>
    </div>
  </section>

  <section id="competenze">
    <h2>Competenze</h2>
    <ul class="chips">
      <li class="hot">SQL</li>
      <li class="hot">DModa</li>
      <li class="hot">AI &amp; Prompting</li>
      <li>Analisi dei processi</li>
      <li>Distinta base</li>
      <li>Ordini e produzione</li>
      <li>Formazione utenti</li>
      <li>Python &amp; API</li>
      <li>Excel</li>
      <li>Stampa 3D &amp; Elettronica</li>
    </ul>
  </section>

  <section id="formazione">
    <h2>Formazione e certificazioni</h2>
    <div class="tl">
      <div>
        <h3>Certificazioni recenti · Coursera</h3>
        <p class="when">2026</p>
        <ul>
          <li><strong>IBM Python for Data Science, AI &amp; Development</strong></li>
          <li><strong>Google Data Analytics Professional Certificate</strong></li>
          <li><strong>Google Prompting Essentials</strong></li>
        </ul>
      </div>
      <div>
        <h3>Ingegneria civile e ambientale</h3>
        <p class="when">Studi universitari · a due esami dalla laurea</p>
      </div>
      <div>
        <h3>Diploma tecnico in elettronica e telecomunicazioni</h3>
      </div>
    </div>
  </section>

  <footer id="contatti">
    <p>Aris · Fermo, Marche</p>
    <div class="links">
      <a href="https://www.linkedin.com" target="_blank" rel="noopener">LinkedIn ↗</a>
      <a href="mailto:tuo.indirizzo@email.it">Scrivimi una mail</a>
    </div>
  </footer>
</div>

<script>
(function(){
  const btn = document.getElementById('themeToggle');
  const root = document.documentElement;
  const states = ['auto', 'dark', 'light'];
  const labels = { auto: 'Tema: Auto', dark: 'Tema: Scuro', light: 'Tema: Chiaro' };
  let idx = 0;
  btn.addEventListener('click', () => {
    idx = (idx + 1) % states.length;
    const mode = states[idx];
    if (mode === 'auto') root.removeAttribute('data-theme');
    else root.setAttribute('data-theme', mode);
    btn.textContent = labels[mode];
  });
})();
</script>
</body>
</html>
